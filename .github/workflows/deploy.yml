name: Local CI/CD Deploy

on:
  push:
    branches:
      - CICD-y
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Deploy index.html to web root
        run: |
          sudo cp index.html /var/www/html/index.html
          sudo chown www-data:www-data /var/www/html/index.html


