<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CI/CD Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f9f9f9;
      color: #333;
    }
    h1 {
      color: #2c3e50;
    }
    .box {
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .highlight {
      color: #27ae60;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>🚀 CI/CD 자동 배포 데모 페이지</h1>
  <p class="highlight">
    GitHub Actions + Self-hosted Runner 기반 자동 배포 성공
  </p>

  <div class="box">
    <h2>2.프로젝트 설명</h2>
    <p>
      이 페이지는 GitHub 저장소에 소스 코드를 push하면,
      별도의 수동 작업 없이 웹 서버에 자동으로 배포되는
      CI/CD 데모 페이지입니다.
      캡스톤 CICD 데모 2차 수정 
    </p>

    <p style="margin-top:10px; color:#555;">
      최근 배포 시간: <span id="time"></span>
    </p>
  </div>

  <script>
    document.getElementById("time").innerText = new Date().toLocaleString();
  </script>

</body>
</html>
